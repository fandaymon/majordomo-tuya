<script type="text/javascript">
	function viewSceneInfo(dev_id){
      var info = document.getElementById("scene"+dev_id);
      info.style.display = "block";
      var url="/ajax/tuya.html?op=info_scene&dev_id="+dev_id;
		
        $.ajax({
            url: url
        }).done(function(data) {
            var info = document.getElementById("sceneInfo"+dev_id);
            info.innerHTML = data;
        });
	}
   
   function hideSceneInfo(dev_id){
      var info = document.getElementById("scene"+dev_id);
      info.style.display = "none";
	}

 </script>

<div style="margin-top: 10px;"></div>
<form action="?" method="post" enctype="multipart/form-data" name="frmEdit" class="form-horizontal">
   <fieldset>
      <div class="form-group">
         <div>
            <table  align=center class="table table-striped">
               <tr>
                  <th><#LANG_TITLE#></th>
                  <th><#LANG_DEVICE#></th>
                  <th><#LANG_TUYA_COMMAND#></th>
                  <th>&nbsp;</th>
               </tr>
               [#begin RESULT#]
               <tr>
                  <td valign="top">[#TITLE#]</td>
                  <td valign="top">[#DEV_ID#]</td>
                  <td valign="top">TuyaScene('[#DEV_ID#]');</td>
                  
                  <td>
                     <div onClick="$.ajax({url: '/ajax/tuya.html?op=run_scene&dev_id=[#DEV_ID#]'});" class="btn btn-default" title="<#LANG_TUYA_RUN_SCENE#>"><i class="glyphicon glyphicon-flash"></i></div>
                     <div onClick="javascript:viewSceneInfo('[#DEV_ID#]');" class="btn btn-default" title="<#LANG_TUYA_VIEW_SCENE_CODE#>"><i class="glyphicon glyphicon-eye-open"></i></div>
                     <a href="?id=[#ID#]&view_mode=delete_tudevices&tab=scene" onClick="return confirm('<#LANG_ARE_YOU_SURE#>');" class="btn btn-default" title="<#LANG_TUYA_DELETE#>">
                     <i class="glyphicon glyphicon-remove"></i>
                  </td>
               </tr>

               <tr id="scene[#DEV_ID#]" onClick="javascript:hideSceneInfo('[#DEV_ID#]');" style="display:none;" class="row">
               <td id="sceneInfo[#DEV_ID#]" class="col-8"></td>
               </tr>
               
               [#end RESULT#]
            </table> 
         </div>
      </div>
      <div class="form-group">
         <div class="col-lg-offset-3 col-lg-4">
            <input type="hidden" name="view_mode" value="<#VIEW_MODE#>">
            <input type="hidden" name="edit_mode" value="<#EDIT_MODE#>">
            <input type="hidden" name="mode" value="update">
            <input type="hidden" name="data_source" value="<#DATA_SOURCE#>">
            <input type="hidden" name="tab" value="<#TAB#>">
         </div>
      </div>
   </fieldset>
</form>
